name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run ruff linter
      run: |
        ruff check .

    - name: Run ruff formatter check
      run: |
        ruff format --check .

    - name: Run mypy type checker
      run: |
        mypy rainscribe.py test_timestamp_sync.py --config-file=pyproject.toml
      continue-on-error: true  # Don't fail CI on type errors initially

    - name: Run unit tests
      run: |
        python -m pytest test_timestamp_sync.py -v --tb=short

    - name: Check for security issues with bandit
      run: |
        bandit -r . -x ./venv,./output --skip B603,B607
      continue-on-error: true  # Don't fail CI on security warnings initially

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t rainscribe:test .

    - name: Verify Docker image
      run: |
        docker images rainscribe:test
