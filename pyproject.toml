[project]
name = "rainscribe"
version = "1.0.0"
description = "Live transcription with native HLS subtitle integration for HLS streaming"
requires-python = ">=3.9"

[tool.ruff]
# Set line length to match common Python standards
line-length = 120
target-version = "py39"

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "output",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

# Ignore specific rules that may be too strict for this project
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B008",    # Do not perform function calls in argument defaults
    "N802",    # Function name should be lowercase (FastAPI routes use camelCase)
    "N803",    # Argument name should be lowercase
    "N806",    # Variable in function should be lowercase (allow for FFmpeg, HLS, etc.)
    "SIM102",  # Use a single if statement (prefer explicit nested ifs for readability)
    "SIM105",  # Use contextlib.suppress (prefer explicit try-except for clarity)
]

[tool.ruff.lint.isort]
known-first-party = ["rainscribe"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"
# Indent with spaces
indent-style = "space"
# Respect existing line endings
line-ending = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, can make stricter later
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Ignore missing imports for third-party libraries without type stubs
[[tool.mypy.overrides]]
module = [
    "websockets.*",
    "uvicorn",
]
ignore_missing_imports = true
